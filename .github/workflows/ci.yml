name: Verify CodeLingo in the cloud
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check docs links
        run: python tools/docs/check_doc_links.py
      - run: pip install -q -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python -m pytest backend/tests -q
      - run: npm ci && npm run typecheck && npm run test:auth && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the browser flow on the cloud runner
        env:
          DATABASE_URL: sqlite:////tmp/codelingo-ci.db
          JOB_MODE: inline
        run: |
          python scripts/dev.py > /tmp/codelingo-ci.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:3000/api/health
          npm --prefix frontend run test:e2e
  migrations:
    # Neon runs PostgreSQL; prove every migration applies, reverts and matches the models there too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codelingo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d codelingo"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/codelingo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -q -r backend/requirements.lock && pip install --no-deps -e backend
      - name: Upgrade, check against models, downgrade and upgrade again
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
