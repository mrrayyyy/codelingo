name: Verify CodeLingo in the cloud
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check docs links
        run: python tools/docs/check_doc_links.py
      - run: pip install -q -r backend/requirements.lock && pip install --no-deps -e backend
      - run: python -m pytest backend/tests -q
      - run: npm ci && npm run typecheck && npm run test:auth && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the browser flow on the cloud runner
        env:
          DATABASE_URL: sqlite:////tmp/codelingo-ci.db
          JOB_MODE: inline
        run: |
          python scripts/dev.py > /tmp/codelingo-ci.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:3000/api/health
          npm --prefix frontend run test:e2e
