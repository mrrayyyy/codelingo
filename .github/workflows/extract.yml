name: Extract repository vocabulary
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: CodeLingo import job UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codelingo-extractor
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install extraction tools on the cloud runner
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.lock
      - name: Extract and return vocabulary
        env:
          CODELINGO_JOB_ID: ${{ inputs.job_id }}
          CODELINGO_URL: ${{ secrets.CODELINGO_URL }}
          CODELINGO_API_KEY: ${{ secrets.CODELINGO_API_KEY }}
        run: python scripts/cloud_extract.py
      # No source artifacts or repository-derived cache are uploaded.
