[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codelingo-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "spacy>=3.8,<3.9",
  "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24", "tree-sitter-go>=0.25,<0.26",
  "langdetect>=1.0.9,<2", "wordfreq>=3.1,<4", "fsrs>=6,<7", "genanki>=0.13,<1"
]

[project.optional-dependencies]
# Starlette 1.x TestClient prefers httpx2 and warns when it falls back to httpx.
test = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
