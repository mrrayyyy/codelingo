# Alembic CLI config for creating revisions; run from the repo root:  .venv/bin/alembic -c backend/alembic.ini revision --autogenerate -m "..."
# The database URL comes from DATABASE_URL / .env via app.config.settings (see app/migrations/env.py).
# At runtime the API migrates itself via app.db.init_db(); this file is not needed in the images.
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
