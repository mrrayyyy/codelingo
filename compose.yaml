name: codelingo
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codelingo
      POSTGRES_USER: codelingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U codelingo -d codelingo']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://codelingo:${POSTGRES_PASSWORD}@db:5432/codelingo
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: arq
      SPOOL_DIR: /spool
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      DICTIONARY_ONLINE: ${DICTIONARY_ONLINE:-false}
      PIPER_BINARY: ${PIPER_BINARY:-}
      PIPER_MODEL: ${PIPER_MODEL:-}
      WHISPER_URL: ${WHISPER_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    volumes: [source-spool:/spool]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import os, urllib.request; urllib.request.urlopen(urllib.request.Request("http://localhost:8000/health", headers={"X-API-Key":os.environ["API_KEY"]}))']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: [arq, app.imports.WorkerSettings]
    environment: *backend-env
    volumes: [source-spool:/spool]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  source-spool:
