services:
  - type: web
    name: codelingo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.cloud
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: WORKSPACE_PASSWORD
        sync: false
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
      - key: GITHUB_ACTIONS_REPO
        sync: false
      - key: JOB_MODE
        value: github_actions
      - key: SPOOL_DIR
        value: /spool
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: DICTIONARY_ONLINE
        value: 'false'
      - key: TTS_PROVIDER
        value: groq
      - key: STT_PROVIDER
        value: groq
      - key: LLM_PROVIDER
        value: groq
